[package]
name = "eidolon"
version = "0.1.0"
edition = "2024"


[profile.release]
opt-level = "z"        # Optimize for size (reduces binary footprint and string fingerprints)
lto = true             # Link-Time Optimization across the entire crate graph
codegen-units = 1      # Force single codegen unit for maximum optimization and dead-code elimination
panic = "abort"        # Strip stack-unwinding machinery (shrinks binary, prevents panic leaks)
strip = true           # Completely strip all symbols, debug info, and export tables


[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"
aes-gcm = "0.10"
ctrlc = "3.4"
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }